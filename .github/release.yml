changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Security and safety
      labels:
        - security
        - safety
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Improvements
      labels:
        - enhancement
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"
