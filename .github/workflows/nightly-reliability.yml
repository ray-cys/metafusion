name: Nightly reliability

on:
  schedule:
    # GitHub cron is UTC. 18:17 UTC is 02:17 Asia/Singapore the next day.
    - cron: "17 18 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-reliability
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qualify-branch:
    name: Qualify ${{ matrix.branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        branch: [main, develop]
    steps:
      # No repository checkout or branch code executes in this default-branch job.
      - name: Dispatch and verify branch-scoped reliability
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ matrix.branch }}
        shell: bash
        run: |
          set -euo pipefail
          requested_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run nightly-branch-reliability.yml \
            --repo "${GITHUB_REPOSITORY}" --ref "${TARGET_BRANCH}"
          run_id=""
          for _attempt in $(seq 1 20); do
            run_id="$(gh run list --repo "${GITHUB_REPOSITORY}" \
              --workflow nightly-branch-reliability.yml --branch "${TARGET_BRANCH}" \
              --event workflow_dispatch --created ">=${requested_at}" \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [[ -z "${run_id}" ]] || break
            sleep 6
          done
          [[ -n "${run_id}" ]]
          echo "Branch-scoped ${TARGET_BRANCH} checks: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >>"${GITHUB_STEP_SUMMARY}"
          timeout 40m gh run watch "${run_id}" --repo "${GITHUB_REPOSITORY}" \
            --interval 20 --exit-status
