name: Live provider canary

on:
  push:
    branches: ["develop"]
    paths:
      - ".github/scripts/provider_canary.py"
      - ".github/workflows/provider-canary.yml"
      - "extensions/formula1/**"
      - "helper/provider_credentials.py"
  schedule:
    # 19:47 UTC is 03:47 Asia/Singapore the next day, after nightly reliability.
    - cron: "47 19 * * *"
  workflow_dispatch:
    inputs:
      require_tmdb:
        description: Fail when the TMDb canary secret is not configured
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: live-provider-canary
  cancel-in-progress: false

jobs:
  provider-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run bounded read-only provider checks
        env:
          TMDB_CANARY_API_KEY: ${{ secrets.TMDB_CANARY_API_KEY }}
          REQUIRE_TMDB: ${{ inputs.require_tmdb || false }}
        shell: bash
        run: |
          arguments=(
            --output provider-canary-report.json
            --github-summary "${GITHUB_STEP_SUMMARY}"
          )
          if [[ "${REQUIRE_TMDB}" == "true" ]]; then
            arguments+=(--require-tmdb)
          fi
          python .github/scripts/provider_canary.py "${arguments[@]}"

      - name: Preserve sanitized canary report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-canary-${{ github.run_id }}
          path: provider-canary-report.json
          if-no-files-found: warn
          retention-days: 30
