name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  # schedule:
  #   - cron: '32 6 * * *'
  push:
    branches: [ "main", "develop", "codex/**" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}


jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Run static checks
        run: ruff check --select F,E9 .

      - name: Run tests
        run: pytest -q --cov=. --cov-report=term-missing --cov-fail-under=75

      - name: Audit Python dependencies
        run: pip-audit -r requirements.lock --require-hashes --disable-pip --no-deps

  security:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build image for vulnerability scan
        run: >-
          docker build
          --build-arg METAFUSION_VERSION=${GITHUB_REF_NAME}
          --build-arg METAFUSION_COMMIT=${GITHUB_SHA}
          --tag metafusion-ci:${GITHUB_SHA} .

      - name: Smoke test Unraid UID/GID remapping
        run: |
          config_dir="$(mktemp -d)"
          docker run --rm \
            --read-only \
            --tmpfs /tmp:size=256m,mode=1777 \
            --security-opt no-new-privileges \
            --stop-timeout 20 \
            --env PUID=99 \
            --env PGID=100 \
            --volume "${config_dir}:/config" \
            metafusion-ci:${GITHUB_SHA} \
            python -c 'import os; from pathlib import Path; assert (os.getuid(), os.getgid()) == (99, 100); target = Path("/config/.ci-write-test"); target.write_text("ok", encoding="utf-8"); status = target.stat(); assert (status.st_uid, status.st_gid) == (99, 100)'

      - name: Exercise environment-only read-only scheduler lifecycle
        run: |
          config_dir="$(mktemp -d)"
          container_id=""
          cleanup() {
            if test -n "${container_id}"; then
              docker rm --force "${container_id}" >/dev/null 2>&1 || true
            fi
            sudo rm -rf -- "${config_dir}"
          }
          trap cleanup EXIT
          chmod 0777 "${config_dir}"
          past_time="$(date -u -d '2 minutes ago' +%H:%M)"
          container_id="$(docker run --detach \
            --read-only \
            --tmpfs /tmp:size=64m,mode=1777 \
            --env PUID=99 \
            --env PGID=100 \
            --env RUN_MODE=plex \
            --env PLEX_URL=http://127.0.0.1:32400 \
            --env PLEX_TOKEN=ci-plex-token \
            --env PLEX_LIBRARIES=Movies \
            --env TMDB_API_KEY=ci-tmdb-key \
            --env RUN_SCHEDULE=True \
            --env RUN_ON_START=False \
            --env RUN_TIMES="${past_time}" \
            --volume "${config_dir}:/config" \
            metafusion-ci:${GITHUB_SHA})"
          for attempt in $(seq 1 20); do
            docker exec --user 99:100 "${container_id}" \
              test -f /tmp/metafusion-status.json && break
            sleep 1
          done
          docker exec --user 99:100 "${container_id}" \
            test -f /tmp/metafusion-status.json
          test ! -e "${config_dir}/metafusion-status.json"
          test ! -e "${config_dir}/config.yml"
          cmp "${config_dir}/config_template.yml" config_template.yml
          test "$(stat -c '%a' "${config_dir}/config_template.yml")" = "664"
          test "$(stat -c '%u:%g' "${config_dir}/config_template.yml")" = "99:100"
          docker exec --user 99:100 "${container_id}" python healthcheck.py
          docker stop --timeout 10 "${container_id}"
          docker rm "${container_id}"
          container_id=""

      - name: Scan image for fixable critical vulnerabilities
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 image \
            --exit-code 1 --ignore-unfixed --severity CRITICAL \
            metafusion-ci:${GITHUB_SHA}

  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      
      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            METAFUSION_VERSION=${{ github.ref_name }}
            METAFUSION_COMMIT=${{ github.sha }}

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
