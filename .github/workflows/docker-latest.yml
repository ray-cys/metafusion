name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  # schedule:
  #   - cron: '32 6 * * *'
  push:
    branches: [ "main", "develop" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}


jobs:
  release-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag origin and format
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+(\.[0-9]+)*)?$ ]]; then
            echo "Unsupported release tag: ${tag}" >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit="$(git rev-list -n 1 "${tag}")"
          main_commit="$(git rev-parse 'origin/main^{commit}')"
          if [[ "${tag_commit}" != "${main_commit}" ]]; then
            echo "Release tags must reference the exact current main commit." >&2
            echo "Tag commit:  ${tag_commit}" >&2
            echo "Main commit: ${main_commit}" >&2
            exit 1
          fi
          duplicate_count="$(git tag --list | awk '{print tolower($0)}' | sort | uniq -d | wc -l | tr -d ' ')"
          test "${duplicate_count}" = "0" || {
            echo "Case-insensitive duplicate release tags were found." >&2
            exit 1
          }

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Run static checks
        run: |
          ruff check .
          mypy
          python tools/generate_config_surfaces.py --check

      - name: Run tests
        run: |
          pytest -q --cov=. --cov-branch --cov-report=term-missing \
            --cov-report=json:coverage.json --cov-fail-under=0
          python tools/check_targeted_coverage.py coverage.json

      - name: Enforce complete Phase 25 safeguard coverage
        run: |
          pytest -q tests/test_phase25_change_canary_kometa.py \
            --cov=helper.tmdb_changes \
            --cov=helper.upgrade_canary \
            --cov=helper.kometa_application_verification \
            --cov-branch --cov-report=term-missing \
            --cov-fail-under=100

      - name: Enforce provider-maintenance tool coverage
        run: |
          pytest -q tests/test_provider_compatibility_bot.py \
            tests/test_phase27_provider_coverage.py \
            --cov=tools.provider_compatibility \
            --cov-config=.coveragerc-provider-tools --cov-branch \
            --cov-report=term-missing --cov-report=json:provider-coverage.json \
            --cov-fail-under=0
          python tools/check_provider_coverage.py provider-coverage.json

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt --require-hashes --disable-pip --no-deps

  kometa-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Resolve pinned provider contract
        id: provider-contract
        run: python3 tools/provider_compatibility.py outputs --github-output "${GITHUB_OUTPUT}"

      - name: Regenerate and verify the Kometa contract corpus
        run: python tools/generate_kometa_contract_corpus.py --check

      - name: Validate generated corpus with baseline and current Kometa
        env:
          BASELINE_IMAGE: ${{ steps.provider-contract.outputs.kometa_baseline_image }}
          CURRENT_IMAGE: ${{ steps.provider-contract.outputs.kometa_current_image }}
        run: |
          set -euo pipefail
          for image in "${BASELINE_IMAGE}" "${CURRENT_IMAGE}"; do
            for contract in tests/golden/kometa_contract_corpus/*.yml; do
              docker run --rm \
                --volume "${PWD}/${contract}:/contract/metadata.yml:ro" \
                "${image}" \
                --config /contract/metadata.yml \
                --validate-file /contract/metadata.yml
            done
          done

  plex-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Validate PlexAPI pin and replay contract
        id: provider-contract
        run: |
          python tools/provider_compatibility.py verify
          replay_tests="$(python tools/provider_compatibility.py outputs | python -c 'import json, sys; print(json.load(sys.stdin)["plex_replay_tests"])')"
          # Paths are restricted to committed tests/*.py values by the contract validator.
          read -r -a test_paths <<<"${replay_tests}"
          pytest -q "${test_paths[@]}"

  performance-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Measure the representative large-library workload
        run: |
          python tools/performance_regression.py \
            --output performance-report.json \
            --github-summary "${GITHUB_STEP_SUMMARY}"

      - name: Preserve the performance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-regression-${{ github.sha }}
          path: performance-report.json
          if-no-files-found: error
          retention-days: 30

  security:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image for vulnerability scan
        run: >-
          docker build
          --build-arg METAFUSION_VERSION=${GITHUB_REF_NAME}
          --build-arg METAFUSION_COMMIT=${GITHUB_SHA}
          --tag metafusion-ci:${GITHUB_SHA} .

      - name: Smoke test Unraid UID/GID remapping
        run: |
          config_dir="$(mktemp -d)"
          docker run --rm \
            --read-only \
            --tmpfs /tmp:size=256m,mode=1777 \
            --security-opt no-new-privileges \
            --stop-timeout 20 \
            --env PUID=99 \
            --env PGID=100 \
            --volume "${config_dir}:/config" \
            metafusion-ci:${GITHUB_SHA} \
            python -c 'import os; from pathlib import Path; assert (os.getuid(), os.getgid()) == (99, 100); reports = Path("/config/reports"); assert reports.is_dir(); assert (reports.stat().st_uid, reports.stat().st_gid) == (99, 100); target = Path("/config/.ci-write-test"); target.write_text("ok", encoding="utf-8"); status = target.stat(); assert (status.st_uid, status.st_gid) == (99, 100)'

      - name: Exercise environment-only read-only scheduler lifecycle
        run: |
          config_dir="$(mktemp -d)"
          container_id=""
          cleanup() {
            if test -n "${container_id}"; then
              docker rm --force "${container_id}" >/dev/null 2>&1 || true
            fi
            sudo rm -rf -- "${config_dir}"
          }
          trap cleanup EXIT
          chmod 0777 "${config_dir}"
          past_time="$(date -u -d '2 minutes ago' +%H:%M)"
          container_id="$(docker run --detach \
            --read-only \
            --tmpfs /tmp:size=64m,mode=1777 \
            --env PUID=99 \
            --env PGID=100 \
            --env RUN_MODE=plex \
            --env PLEX_URL=http://127.0.0.1:32400 \
            --env PLEX_TOKEN=ci-plex-token \
            --env PLEX_LIBRARIES=Movies \
            --env TMDB_API_KEY=ci-tmdb-key \
            --env RUN_SCHEDULE=True \
            --env RUN_ON_START=False \
            --env RUN_TIMES="${past_time}" \
            --volume "${config_dir}:/config" \
            metafusion-ci:${GITHUB_SHA})"
          for attempt in $(seq 1 20); do
            docker exec --user 99:100 "${container_id}" \
              test -f /tmp/metafusion-status.json && break
            sleep 1
          done
          docker exec --user 99:100 "${container_id}" \
            test -f /tmp/metafusion-status.json
          test ! -e "${config_dir}/metafusion-status.json"
          test ! -e "${config_dir}/config.yml"
          cmp "${config_dir}/config_template.yml" config_template.yml
          test "$(stat -c '%a' "${config_dir}/config_template.yml")" = "664"
          test "$(stat -c '%u:%g' "${config_dir}/config_template.yml")" = "99:100"
          docker exec --user 99:100 "${container_id}" python healthcheck.py
          docker stop --timeout 10 "${container_id}"
          docker rm "${container_id}"
          container_id=""

      - name: Scan image for fixable critical vulnerabilities
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 image \
            --exit-code 1 --ignore-unfixed --severity CRITICAL \
            metafusion-ci:${GITHUB_SHA}

  build:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/develop' ||
        startsWith(github.ref, 'refs/tags/v')))
    needs: [release-guard, test, kometa-contract, plex-contract, performance-regression, security]
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('metafusion-pr-build-{0}', github.event.pull_request.number) || 'metafusion-registry-publish' }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc.') }}
          labels: |
            org.opencontainers.image.licenses=LicenseRef-All-Rights-Reserved
      
      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
          build-args: |
            METAFUSION_VERSION=${{ github.ref_name }}
            METAFUSION_COMMIT=${{ github.sha }}

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Smoke test published AMD64 and ARM64 manifests
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          amd64_version="$(docker run --rm --platform linux/amd64 "${image}" --version)"
          [[ "${amd64_version}" == *"MetaFusion ${GITHUB_REF_NAME} (${GITHUB_SHA})"* ]]
          # Docker cannot keep two platform-specific images under the same
          # manifest-list digest in one local image store. Remove the first
          # platform before pulling and running the second one.
          docker image rm --force "${image}"
          arm64_version="$(docker run --rm --platform linux/arm64 "${image}" --version)"
          [[ "${arm64_version}" == *"MetaFusion ${GITHUB_REF_NAME} (${GITHUB_SHA})"* ]]

      - name: Verify published aliases, signature, SBOM, and provenance
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] || continue
            manifest_json="$(docker buildx imagetools inspect "${tag}" --format '{{json .Manifest}}')"
            resolved_digest="$(jq -r '.digest' <<<"${manifest_json}")"
            if [[ "${resolved_digest}" != "${DIGEST}" ]]; then
              echo "Published alias ${tag} resolved to ${resolved_digest}, expected ${DIGEST}." >&2
              exit 1
            fi
          done <<<"${TAGS}"

          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/docker-latest.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${image}" >/dev/null

          sbom_json="$(docker buildx imagetools inspect "${image}" --format '{{json .SBOM}}')"
          provenance_json="$(docker buildx imagetools inspect "${image}" --format '{{json .Provenance}}')"
          [[ -n "${sbom_json}" && "${sbom_json}" != "null" && "${sbom_json}" != "{}" ]]
          [[ -n "${provenance_json}" && "${provenance_json}" != "null" && "${provenance_json}" != "{}" ]]

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub Release ${tag} already exists."
            exit 0
          fi
          if [[ "${tag}" == *-rc.* ]]; then
            gh release create "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --generate-notes \
              --prerelease \
              --title "${tag}"
          else
            gh release create "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --generate-notes \
              --latest \
              --title "${tag}"
          fi
