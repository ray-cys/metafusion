name: Plex metadata issue
description: Report direct Plex API updates, locks, policies, write limits, restore, or verification problems.
title: "[Plex metadata] "
labels: ["bug", "plex-metadata"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form only for direct metadata behavior with `RUN_MODE=plex` and Plex metadata updates enabled. Use the Docker form for mounts/paths and the artwork/identity form for image problems.

        Attach a sanitized Plex metadata report and relevant log lines. Never post a Plex token, private URL, or unredacted path.
  - type: input
    id: version
    attributes:
      label: MetaFusion version
      description: Paste the exact version and commit printed by `python metafusion.py --version`.
    validations:
      required: true
  - type: input
    id: plex_version
    attributes:
      label: Plex Media Server version
    validations:
      required: true
  - type: dropdown
    id: behavior
    attributes:
      label: Affected behavior
      options:
        - fill_missing decision
        - managed update
        - overwrite update
        - Locked field handling
        - Tag merge or synchronization
        - Write limit, deferral, or retry
        - Restore or unlock
        - Metadata or artwork adoption verification
        - Other
    validations:
      required: true
  - type: dropdown
    id: policy
    attributes:
      label: Plex metadata policy
      options:
        - fill_missing
        - managed
        - overwrite
    validations:
      required: true
  - type: input
    id: fields
    attributes:
      label: Affected fields
      description: List field names only; do not include private content.
      placeholder: summary, content_rating, genre
    validations:
      required: true
  - type: dropdown
    id: dry_run
    attributes:
      label: Reproduced in dry-run
      options:
        - "Yes"
        - "No"
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and field state
      description: Include policy, allowlist, lock state, existing value state, and the smallest reproduction sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected decision
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual decision
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics
      description: Attach the redacted Plex metadata report, item explanation if relevant, and the smallest useful log excerpt.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and included exact MetaFusion and Plex versions.
          required: true
        - label: I removed the Plex token, private URL, media paths, and other secrets.
          required: true
