name: Kometa output issue
description: Report YAML, schema, merge, ordering, edition, or application-verification problems.
title: "[Kometa] "
labels: ["bug", "kometa"]
body:
  - type: markdown
    attributes:
      value: |
        Use the artwork/identity form for image selection problems and the runtime/cleanup form for cleanup behavior.

        Share the smallest sanitized YAML excerpt and relevant report. Never post tokens, API keys, private URLs, or unredacted paths.
  - type: input
    id: version
    attributes:
      label: MetaFusion version
      description: Paste the exact version and commit printed by `python metafusion.py --version`.
    validations:
      required: true
  - type: dropdown
    id: output_type
    attributes:
      label: Affected output
      options:
        - Movie metadata YAML
        - TV metadata YAML
        - Season or episode metadata
        - Match key, edition, or duplicate identity
        - Schema validation or field ordering
        - Merge or preservation behavior
        - Post-Kometa application verification
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the item, relevant non-secret settings, and whether the output was newly created or merged.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected output or behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual output or behavior
    validations:
      required: true
  - type: textarea
    id: yaml_excerpt
    attributes:
      label: Smallest sanitized YAML excerpt
      render: yaml
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics
      description: Attach a redacted support report plus the relevant compatibility, metadata-audit, Kometa-application, or log excerpt.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and included the exact MetaFusion version.
          required: true
        - label: I removed tokens, API keys, private URLs, and unredacted paths.
          required: true
