name: Docker or Unraid issue
description: Report startup, shutdown, permission, mount, health, scheduling, or image problems.
title: "[Docker] "
labels: ["bug", "docker"]
body:
  - type: markdown
    attributes:
      value: |
        Run `python metafusion.py --version` and, when possible, `python metafusion.py --support-report` inside the container.

        Do not post Docker inspection output. Share only the relevant redacted settings and log lines.
  - type: input
    id: version
    attributes:
      label: MetaFusion version
      description: Paste the exact version and commit printed by `python metafusion.py --version`.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Unraid
        - Docker Compose
        - Docker CLI
        - Other container platform
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Container start or stop
        - Permission or ownership
        - Mount or path mapping
        - Health check or scheduler
        - Image, architecture, or resource use
        - Other
    validations:
      required: true
  - type: dropdown
    id: config_source
    attributes:
      label: Configuration source
      options:
        - Environment variables only
        - config.yml
        - kometa.yml
        - plex.yml
        - Not sure
    validations:
      required: true
  - type: input
    id: puid_pgid
    attributes:
      label: PUID and PGID
      description: Optional. Include only for a permission or ownership problem.
      placeholder: 99:100
  - type: textarea
    id: container_settings
    attributes:
      label: Relevant container settings
      description: List only the affected mount, user, stop-timeout, schedule, or resource settings. Redact private paths.
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics
      description: Attach a redacted support report and the smallest useful log excerpt, or explain why they are unavailable.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues and described any custom user or entrypoint override.
          required: true
        - label: I removed tokens, API keys, private URLs, Docker inspection output, and unredacted paths.
          required: true
