name: Bug report
description: Report reproducible unexpected behavior that does not fit a more specific form.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues and use a more specific form when one matches. Run `python metafusion.py --version` and, when useful, `python metafusion.py --support-report`.

        Never upload `config.yml`, Docker inspection output, tokens, API keys, private URLs, or unredacted host paths.
  - type: input
    id: version
    attributes:
      label: MetaFusion version
      description: Paste the exact version and commit printed by `python metafusion.py --version`.
      placeholder: v1.3.0 (commit abc1234)
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Operation mode
      options:
        - Kometa
        - Plex
        - Both or not mode-specific
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Unraid
        - Docker Compose
        - Docker CLI
        - Source checkout
        - Other
    validations:
      required: true
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Describe the problem in one sentence.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Every run
        - Intermittent
        - Happened once
        - Not sure
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest sequence and relevant non-secret settings needed to reproduce it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics
      description: Attach a redacted support report, problem-specific report, or log excerpt. If none is available, explain why.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues for the same problem.
          required: true
        - label: I included the exact MetaFusion version and removed secrets and private paths.
          required: true
