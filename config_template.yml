# Plex Metadata Generator & Asset Downloader Configuration Template

# Force run of MetaFusion
metafusion_run: false

# Dry run and logging configuration
settings:
  schedule: true
  run_on_start: false
  run_times:
    - "06:00"
    - "18:30"
  dry_run: false
  log_level: "INFO"
  mode: "kometa"  # or "plex"
  path: "/kometa"

# Plex server configuration
plex:
  url: "http://10.0.0.1:32400"
  token: "YOUR_PLEX_TOKEN"
  # Optional Plex-server path to MetaFusion-container path translations.
  # Docker bind mounts are still required for every destination.
  path_mappings: []
  # - "/volume1/media=>/media"

# Plex libraries to process
plex_libraries:
  - Movies
  - TV Shows

# TMDb API configuration
tmdb:
  api_key: "YOUR_TMDB_API_KEY"
  # Metadata language. Artwork fallbacks below do not change metadata text.
  language: "en-US"
  region: "US"
  fallback:
    - zh
    - ja

# Metadata and asset processing options
metadata:
  run_basic: true
  run_enhanced: true

# Direct Plex API metadata enrichment is Plex-mode only and opt-in. Begin with
# fill_missing, DRY_RUN=true, and a small write limit. See README.md before use.
plex_metadata:
  enabled: false
  policy: "fill_missing"  # fill_missing, managed, or overwrite
  lock_writes: false
  lock_merged_tags: false
  allow_overwrite: false  # required acknowledgement for overwrite
  recheck_days: 30
  max_writes_per_run: 100
  report_retention: 10
  fields: []  # Empty means every supported safe field.

assets:
  run_poster: true
  run_season: true
  run_background: false

cleanup:
  # Cleanup is intentionally opt-in. Test with dry_run before enabling it.
  run_process: false

# Runtime limits protect large libraries from exhausting memory/connections.
runtime:
  max_concurrency: 8
  request_timeout: 30
  connect_timeout: 10
  plex_timeout: 10
  plex_retries: 3
  plex_retry_delay: 1
  shutdown_timeout: 15
  max_image_mb: 25

# Skip unchanged Plex items between periodic reconciliation scans.
incremental:
  enabled: true
  full_scan_interval_hours: 168

# Unchanged items become eligible for an artwork refresh when these intervals
# expire. Per-type null values inherit default_days. Set an interval to 0 to
# disable timed refreshes for that type; changed items and full scans can still
# install missing or objectively better artwork.
image_upgrades:
  default_days: 30
  movie_days: null
  series_days: null
  season_days: null

# Optional per-library artwork cadence and Plex metadata policy.
library_overrides: {}
#  Movies 4K:
#    image_upgrades:
#      movie_days: 60
#  Anime:
#    plex_metadata:
#      policy: fill_missing
#      max_writes_per_run: 25

# Persist successful TMDb JSON responses to reduce repeated API traffic.
tmdb_cache:
  enabled: true
  ttl_hours: 24
  max_entries: 5000
  max_mb: 0  # Optional compressed-payload limit; 0 disables the byte cap.

# Validate Kometa document structure and retain known-good output backups.
output:
  validate_schema: true
  backup_count: 3

safety:
  # Kometa cannot reliably match duplicate title/year movies unless every copy
  # has a unique Plex edition. Keep false to fail safely on ambiguous matches.
  allow_ambiguous_editions: false

# Poster selection preferences (Only if run_poster is true)
poster_set:
  max_width: 2000
  max_height: 3000
  min_width: 1000
  min_height: 1500
  prefer_vote: 5.0
  vote_relaxed: 3.5
  vote_threshold: 5.0

# Season poster selection preferences (Only if run_season is true)
season_set:
  max_width: 2000
  max_height: 3000
  min_width: 1000
  min_height: 1500
  prefer_vote: 5.0
  vote_relaxed: 0.5
  vote_threshold: 3.0 
  
# Background selection preferences (Only if run_background is true)
background_set:
  max_width: 3840
  max_height: 2160
  min_width: 1920
  min_height: 1080
  prefer_vote: 5.0
  vote_relaxed: 3.5
  vote_threshold: 5.0
