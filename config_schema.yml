schema_version: 1
defaults:
  metafusion_run: false
  settings:
    schedule: true
    run_on_start: false
    schedule_catch_up: true
    schedule_catch_up_max_hours: 24.0
    run_times:
    - 06:00
    - '18:30'
    dry_run: false
    log_level: INFO
    log_max_mb: 10.0
    log_backup_count: 14
    mode: kometa
    path: /kometa/
  plex:
    url: http://10.0.0.1:32400
    token: PLEX_TOKEN
    path_mappings: []
  plex_libraries:
  - auto
  tmdb:
    api_key: TMDB_API_KEY
    language: en-US
    fallback:
    - zh
    - ja
    region: US
    artwork_allow_any_language: true
    title_search_fallback: false
    episode_group_fallback: true
    split_series_show_policy: preserve
    split_series_mappings: {}
    episode_overrides: {}
  metadata:
    run_basic: true
    run_enhanced: true
  kometa:
    tag_policy: append
  compatibility:
    profile: auto
  plex_metadata:
    enabled: false
    policy: fill_missing
    lock_writes: false
    lock_merged_tags: false
    allow_overwrite: false
    recheck_days: 30.0
    max_writes_per_run: 100
    fields: []
  assets:
    run_poster: true
    run_season: true
    run_background: false
    update_policy: managed
  cleanup:
    run_cleanup: false
    confirmation_scans: 2
    grace_hours: 48.0
    plex_remove_managed_artwork: false
  runtime:
    max_concurrency: 0
    request_timeout: 30.0
    connect_timeout: 10.0
    plex_timeout: 10.0
    plex_retries: 3
    plex_retry_delay: 1.0
    shutdown_timeout: 15.0
    max_image_mb: 25
    validate_media_mounts: true
    min_free_space_mb: 256
  incremental:
    enabled: true
    full_scan_interval_hours: 168.0
    metadata_pending_recheck_hours: 24.0
  image_upgrades:
    default_days: 30.0
    movie_days: null
    series_days: null
    season_days: null
  library_overrides: {}
  tmdb_cache:
    enabled: true
    ttl_hours: 24.0
    negative_ttl_hours: 12.0
    max_entries: 0
    max_mb: 0.0
  output:
    validate_schema: true
    backup_count: 3
    report_retention: 10
  safety:
    allow_ambiguous_editions: false
  poster_set:
    max_width: 2000
    max_height: 3000
    min_width: 1000
    min_height: 1500
    prefer_vote: 5.0
    vote_relaxed: 3.5
    vote_threshold: 5.0
  season_set:
    max_width: 2000
    max_height: 3000
    min_width: 1000
    min_height: 1500
    prefer_vote: 5.0
    vote_relaxed: 0.5
    vote_threshold: 3.0
  background_set:
    max_width: 3840
    max_height: 2160
    min_width: 1920
    min_height: 1080
    prefer_vote: 5.0
    vote_relaxed: 3.5
    vote_threshold: 5.0
settings:
- name: TZ
  section: Identity, connection, and TMDb
  description: Timezone used by RUN_TIMES, for example Asia/Singapore.
  env_example: UTC
  env_order: 0
  compose: ${TZ:-UTC}
  compose_order: 4
  unraid:
    name: Timezone
    default: UTC
    display: always
    required: false
    mask: false
    value: UTC
    order: 8
- name: PUID
  section: Identity, connection, and TMDb
  description: Unraid nobody user ID. Keep 99 unless your output paths use a different owner.
  env_example: '10001'
  env_order: 1
  compose: ${PUID:-10001}
  compose_order: 1
  unraid:
    name: Runtime User ID
    default: '99'
    display: always
    required: false
    mask: false
    value: '99'
    order: 6
- name: PGID
  section: Identity, connection, and TMDb
  description: Unraid users group ID. Keep 100 unless your output paths use a different group.
  env_example: '10001'
  env_order: 2
  compose: ${PGID:-10001}
  compose_order: 2
  unraid:
    name: Runtime Group ID
    default: '100'
    display: always
    required: false
    mask: false
    value: '100'
    order: 7
- name: METAFUSION_IMAGE
  section: Container paths and lifecycle
  description: Docker image tag or digest used by Compose.
  env_example: ghcr.io/ray-cys/metafusion:main
  env_order: 3
- name: PLEX_URL
  section: Connections and mode
  description: Required complete Plex server URL, for example http://192.168.1.10:32400.
  path:
  - plex
  - url
  converter: string
  env_example: http://10.0.0.1:32400
  env_order: 4
  compose: ${PLEX_URL-}
  compose_order: 5
  unraid:
    name: Plex URL
    default: ''
    display: always
    required: true
    mask: false
    value: ''
    order: 1
- name: PLEX_TOKEN
  section: Connections and mode
  description: Required Plex authentication token. It is masked in the Unraid form and redacted from MetaFusion logs.
  path:
  - plex
  - token
  converter: string
  env_example: replace-with-plex-token
  env_order: 5
  compose: ${PLEX_TOKEN-}
  compose_order: 6
  unraid:
    name: Plex Token
    default: ''
    display: always
    required: true
    mask: true
    value: ''
    order: 2
- name: PLEX_TOKEN_FILE
  section: Identity, connection, and TMDb
  description: Optional mounted secret-file path. PLEX_TOKEN takes priority when both are set.
  secret_file:
    path:
    - plex
    - token
    direct_env: PLEX_TOKEN
  env_example: ''
  env_order: 6
  compose: ${PLEX_TOKEN_FILE-}
  compose_order: 7
  unraid:
    name: Plex Token File
    default: ''
    display: advanced
    required: false
    mask: false
    value: ''
    order: 10
- name: PLEX_LIBRARIES
  section: Connections and mode
  description: Use auto to discover every movie/show library, or provide comma-separated exact names to limit scope.
  path:
  - plex_libraries
  converter: safe_list
  env_example: auto
  env_order: 7
  compose: ${PLEX_LIBRARIES-}
  compose_order: 8
  unraid:
    name: Plex Libraries
    default: auto
    display: always
    required: true
    mask: false
    value: auto
    order: 3
- name: PLEX_PATH_MAPPINGS
  section: Connections and mode
  description: Optional semicolon-separated Plex-to-container translations such as /volume1/media=>/media. Matching Docker
    path mappings are still required.
  path:
  - plex
  - path_mappings
  converter: safe_path_mappings
  env_example: ''
  env_order: 8
  compose: ${PLEX_PATH_MAPPINGS-}
  compose_order: 9
  unraid:
    name: Plex Path Mappings
    default: ''
    display: advanced
    required: false
    mask: false
    value: ''
    order: 4
- name: TMDB_API_KEY
  section: Connections and mode
  description: Required TMDb API key. It is masked in the Unraid form and redacted from MetaFusion logs.
  path:
  - tmdb
  - api_key
  converter: string
  env_example: replace-with-tmdb-api-key
  env_order: 9
  compose: ${TMDB_API_KEY-}
  compose_order: 10
  unraid:
    name: TMDb API Key
    default: ''
    display: always
    required: true
    mask: true
    value: ''
    order: 5
- name: TMDB_API_KEY_FILE
  section: Identity, connection, and TMDb
  description: Optional mounted secret-file path. TMDB_API_KEY takes priority when both are set.
  secret_file:
    path:
    - tmdb
    - api_key
    direct_env: TMDB_API_KEY
  env_example: ''
  env_order: 10
  compose: ${TMDB_API_KEY_FILE-}
  compose_order: 11
  unraid:
    name: TMDb API Key File
    default: ''
    display: advanced
    required: false
    mask: false
    value: ''
    order: 11
- name: TMDB_LANGUAGE
  section: Identity, connection, and TMDb
  description: Metadata language and primary artwork language.
  path:
  - tmdb
  - language
  converter: string
  env_example: en-US
  env_order: 11
  compose: ${TMDB_LANGUAGE-}
  compose_order: 12
  unraid:
    name: TMDb Metadata Language
    default: en-US
    display: advanced
    required: false
    mask: false
    value: en-US
    order: 12
- name: TMDB_LANGUAGE_FALLBACK
  section: Identity, connection, and TMDb
  description: Comma-separated artwork-only fallback languages. Metadata text still uses TMDB_LANGUAGE.
  path:
  - tmdb
  - fallback
  converter: safe_list
  env_example: zh,ja
  env_order: 12
  compose: ${TMDB_LANGUAGE_FALLBACK-}
  compose_order: 14
  unraid:
    name: TMDb Artwork Fallbacks
    default: zh,ja
    display: advanced
    required: false
    mask: false
    value: zh,ja
    order: 13
- name: TMDB_REGION
  section: Identity, connection, and TMDb
  description: Release and certification region used for metadata.
  path:
  - tmdb
  - region
  converter: string
  env_example: US
  env_order: 13
  compose: ${TMDB_REGION-}
  compose_order: 13
  unraid:
    name: TMDb Region
    default: US
    display: advanced
    required: false
    mask: false
    value: US
    order: 14
- name: ARTWORK_ALLOW_ANY_LANGUAGE
  section: Identity, connection, and TMDb
  description: When preferred languages have no usable artwork, make one unfiltered TMDb image request.
  path:
  - tmdb
  - artwork_allow_any_language
  converter: safe_bool
  env_example: 'True'
  env_order: 14
  compose: ${ARTWORK_ALLOW_ANY_LANGUAGE-}
  compose_order: 15
  unraid:
    name: Allow Any Artwork Language
    default: True|False
    display: advanced
    required: false
    mask: false
    value: 'True'
    order: 15
- name: TMDB_TITLE_SEARCH_FALLBACK
  section: Identity, connection, and TMDb
  description: Use conservative exact-title and year search only when Plex provides no usable external ID.
  path:
  - tmdb
  - title_search_fallback
  converter: safe_bool
  env_example: 'False'
  env_order: 15
  compose: ${TMDB_TITLE_SEARCH_FALLBACK-}
  compose_order: 16
  unraid:
    name: TMDb Title Search Fallback
    default: False|True
    display: advanced
    required: false
    mask: false
    value: 'False'
    order: 16
- name: TMDB_EPISODE_GROUP_FALLBACK
  section: Identity, connection, and TMDb
  description: Use alternate TMDb episode ordering only when one group uniquely covers the Plex inventory.
  path:
  - tmdb
  - episode_group_fallback
  converter: safe_bool
  env_example: 'True'
  env_order: 16
  compose: ${TMDB_EPISODE_GROUP_FALLBACK-}
  compose_order: 17
  unraid:
    name: TMDb Episode Group Fallback
    default: True|False
    display: advanced
    required: false
    mask: false
    value: 'True'
    order: 17
- name: TMDB_SPLIT_SERIES_SHOW_POLICY
  section: Identity, connection, and TMDb
  description: For mapped split series, preserve keeps Plex top-level show metadata and artwork; primary uses the primary
    TMDb show.
  path:
  - tmdb
  - split_series_show_policy
  converter: string
  env_example: preserve
  env_order: 17
  compose: ${TMDB_SPLIT_SERIES_SHOW_POLICY-}
  compose_order: 18
  unraid:
    name: Split-Series Show Policy
    default: preserve|primary
    display: advanced
    required: false
    mask: false
    value: preserve
    order: 18
- name: TMDB_SPLIT_SERIES_MAPPINGS
  section: Identity, connection, and TMDb
  description: Advanced JSON provider mapping keyed by tmdb:, tvdb:, or imdb:. Leave {} unless documenting a verified anthology
    mapping.
  path:
  - tmdb
  - split_series_mappings
  converter: safe_json_mapping
  env_example: '{}'
  env_order: 18
  compose: ${TMDB_SPLIT_SERIES_MAPPINGS-}
  compose_order: 19
  unraid:
    name: Split-Series Mappings JSON
    default: '{}'
    display: advanced
    required: false
    mask: false
    value: '{}'
    order: 19
- name: TMDB_EPISODE_OVERRIDES
  section: Identity, connection, and TMDb
  description: Advanced JSON Plex-to-TMDb episode-number exceptions keyed by provider ID. Leave {} unless a verified numbering
    correction is required.
  path:
  - tmdb
  - episode_overrides
  converter: safe_json_mapping
  env_example: '{}'
  env_order: 19
  compose: ${TMDB_EPISODE_OVERRIDES-}
  compose_order: 20
  unraid:
    name: Episode Overrides JSON
    default: '{}'
    display: advanced
    required: false
    mask: false
    value: '{}'
    order: 20
- name: CONFIG_PATH
  section: Container paths and lifecycle
  description: Host path mounted at /config by Compose.
  env_example: ./config
  env_order: 20
- name: KOMETA_HOST_PATH
  section: Container paths and lifecycle
  description: Host path mounted at /kometa by Compose.
  env_example: ./kometa
  env_order: 21
- name: KOMETA_PATH
  section: Identity, connection, and TMDb
  description: Container output root used in Kometa mode. Keep aligned with the /kometa path mapping.
  path:
  - settings
  - path
  converter: string
  env_example: /kometa
  env_order: 22
  compose: ${KOMETA_PATH-}
  compose_order: 3
  unraid:
    name: Kometa Container Path
    default: /kometa
    display: advanced
    required: false
    mask: false
    value: /kometa
    order: 9
- name: RUN_MODE
  section: Connections and mode
  description: Required output mode. kometa writes Kometa YAML and assets; plex writes artwork beside media and does not create
    Kometa YAML.
  path:
  - settings
  - mode
  converter: string
  env_example: kometa
  env_order: 23
  compose: ${RUN_MODE-}
  compose_order: 21
  unraid:
    name: Output Mode
    default: kometa|plex
    display: always
    required: true
    mask: false
    value: kometa
    order: 0
- name: METAFUSION_RUN
  section: Scheduling and processing
  description: Run once instead of remaining in scheduler mode. Normally keep False for an Unraid service.
  path:
  - metafusion_run
  converter: safe_bool
  env_example: 'False'
  env_order: 24
  compose: ${METAFUSION_RUN-}
  compose_order: 22
  unraid:
    name: Run Once on Container Start
    default: False|True
    display: advanced
    required: false
    mask: false
    value: 'False'
    order: 21
- name: RUN_SCHEDULE
  section: Scheduling and processing
  description: Keep the container running and execute at RUN_TIMES.
  path:
  - settings
  - schedule
  converter: safe_bool
  env_example: 'True'
  env_order: 25
  compose: ${RUN_SCHEDULE-}
  compose_order: 24
  unraid:
    name: Enable Scheduler
    default: True|False
    display: always
    required: false
    mask: false
    value: 'True'
    order: 22
- name: RUN_ON_START
  section: Scheduling and processing
  description: Run one job immediately after scheduler startup, then continue normally.
  path:
  - settings
  - run_on_start
  converter: safe_bool
  env_example: 'False'
  env_order: 26
  compose: ${RUN_ON_START-}
  compose_order: 25
  unraid:
    name: Run When Scheduler Starts
    default: False|True
    display: advanced
    required: false
    mask: false
    value: 'False'
    order: 23
- name: SCHEDULE_CATCH_UP
  section: Scheduling and processing
  description: After a restart, run the latest missed scheduled slot when it is within the catch-up window.
  path:
  - settings
  - schedule_catch_up
  converter: safe_bool
  env_example: 'True'
  env_order: 27
  compose: ${SCHEDULE_CATCH_UP-}
  compose_order: 26
  unraid:
    name: Catch Up Missed Schedule
    default: True|False
    display: advanced
    required: false
    mask: false
    value: 'True'
    order: 24
- name: SCHEDULE_CATCH_UP_MAX_HOURS
  section: Scheduling and processing
  description: Maximum age of a missed schedule that may run after startup.
  path:
  - settings
  - schedule_catch_up_max_hours
  converter: safe_float
  env_example: '24'
  env_order: 28
  compose: ${SCHEDULE_CATCH_UP_MAX_HOURS-}
  compose_order: 27
  unraid:
    name: Schedule Catch-Up Window Hours
    default: '24'
    display: advanced
    required: false
    mask: false
    value: '24'
    order: 25
- name: RUN_TIMES
  section: Scheduling and processing
  description: Comma-separated daily HH:MM times interpreted using TZ.
  path:
  - settings
  - run_times
  converter: safe_list
  env_example: 06:00,18:30
  env_order: 29
  compose: ${RUN_TIMES-}
  compose_order: 28
  unraid:
    name: Scheduled Run Times
    default: 06:00,18:30
    display: always
    required: false
    mask: false
    value: 06:00,18:30
    order: 26
- name: DRY_RUN
  section: Scheduling and processing
  description: Calculate and log without writing generated data or deleting files.
  path:
  - settings
  - dry_run
  converter: safe_bool
  env_example: 'False'
  env_order: 30
  compose: ${DRY_RUN-}
  compose_order: 23
  unraid:
    name: Dry Run
    default: False|True
    display: always
    required: false
    mask: false
    value: 'False'
    order: 27
- name: LOG_LEVEL
  section: Scheduling and processing
  description: Application logging verbosity.
  path:
  - settings
  - log_level
  converter: string
  env_example: INFO
  env_order: 31
  compose: ${LOG_LEVEL-}
  compose_order: 29
  unraid:
    name: Log Level
    default: INFO|DEBUG|WARNING|ERROR|CRITICAL
    display: advanced
    required: false
    mask: false
    value: INFO
    order: 28
- name: LOG_MAX_MB
  section: Scheduling and processing
  description: Rotate the active log at this size as well as daily. Set 0 to disable only size rotation.
  path:
  - settings
  - log_max_mb
  converter: safe_float
  env_example: '10'
  env_order: 32
  compose: ${LOG_MAX_MB-}
  compose_order: 30
  unraid:
    name: Log Maximum MiB
    default: '10'
    display: advanced
    required: false
    mask: false
    value: '10'
    order: 29
- name: LOG_BACKUP_COUNT
  section: Scheduling and processing
  description: Number of daily or size-rotated log files retained.
  path:
  - settings
  - log_backup_count
  converter: safe_int
  env_example: '14'
  env_order: 33
  compose: ${LOG_BACKUP_COUNT-}
  compose_order: 31
  unraid:
    name: Log Backup Count
    default: '14'
    display: advanced
    required: false
    mask: false
    value: '14'
    order: 30
- name: RUN_BASIC
  section: Scheduling and processing
  description: Generate core metadata. Enhanced metadata requires this option.
  path:
  - metadata
  - run_basic
  converter: safe_bool
  env_example: 'True'
  env_order: 34
  compose: ${RUN_BASIC-}
  compose_order: 32
  unraid:
    name: Generate Basic Metadata
    default: True|False
    display: always
    required: false
    mask: false
    value: 'True'
    order: 31
- name: RUN_ENHANCED
  section: Scheduling and processing
  description: Generate Kometa-supported director, writer, and producer metadata. Cast remains managed by Plex's online provider.
  path:
  - metadata
  - run_enhanced
  converter: safe_bool
  env_example: 'True'
  env_order: 35
  compose: ${RUN_ENHANCED-}
  compose_order: 33
  unraid:
    name: Generate Enhanced Metadata
    default: True|False
    display: always
    required: false
    mask: false
    value: 'True'
    order: 32
- name: KOMETA_TAG_POLICY
  section: Scheduling and processing
  description: Kometa mode tag behavior. append preserves provider and user tags; sync makes supported tags match TMDb.
  path:
  - kometa
  - tag_policy
  converter: string
  env_example: append
  env_order: 36
  compose: ${KOMETA_TAG_POLICY-}
  compose_order: 34
  unraid:
    name: Kometa Tag Policy
    default: append|sync
    display: advanced
    required: false
    mask: false
    value: append
    order: 33
- name: PLEX_METADATA_UPDATES
  section: Scheduling and processing
  description: Plex mode only. Opt in to direct metadata edits through the Plex API. Test with Dry Run first.
  path:
  - plex_metadata
  - enabled
  converter: safe_bool
  env_example: 'False'
  env_order: 37
  compose: ${PLEX_METADATA_UPDATES-}
  compose_order: 35
  unraid:
    name: Direct Plex Metadata Updates
    default: False|True
    display: advanced
    required: false
    mask: false
    value: 'False'
    order: 34
- name: PLEX_METADATA_POLICY
  section: Scheduling and processing
  description: fill_missing is safest; managed updates only MetaFusion-owned values; overwrite exactly syncs selected fields
    and requires explicit acknowledgement.
  path:
  - plex_metadata
  - policy
  converter: string
  env_example: fill_missing
  env_order: 38
  compose: ${PLEX_METADATA_POLICY-}
  compose_order: 36
  unraid:
    name: Plex Metadata Policy
    default: fill_missing|managed|overwrite
    display: advanced
    required: false
    mask: false
    value: fill_missing
    order: 35
- name: PLEX_METADATA_LOCK_WRITES
  section: Scheduling and processing
  description: Lock scalar fields written by MetaFusion. Leave False unless provider refreshes overwrite them.
  path:
  - plex_metadata
  - lock_writes
  converter: safe_bool
  env_example: 'False'
  env_order: 39
  compose: ${PLEX_METADATA_LOCK_WRITES-}
  compose_order: 37
  unraid:
    name: Lock Plex Scalar Writes
    default: False|True
    display: advanced
    required: false
    mask: false
    value: 'False'
    order: 36
- name: PLEX_METADATA_LOCK_MERGED_TAGS
  section: Scheduling and processing
  description: Lock a complete merged tag field after MetaFusion adds tags. Use cautiously because the lock affects tags from
    every source.
  path:
  - plex_metadata
  - lock_merged_tags
  converter: safe_bool
  env_example: 'False'
  env_order: 40
  compose: ${PLEX_METADATA_LOCK_MERGED_TAGS-}
  compose_order: 38
  unraid:
    name: Lock Merged Plex Tags
    default: False|True
    display: advanced
    required: false
    mask: false
    value: 'False'
    order: 37
- name: PLEX_METADATA_ALLOW_OVERWRITE
  section: Scheduling and processing
  description: Required safety acknowledgement before overwrite policy can start.
  path:
  - plex_metadata
  - allow_overwrite
  converter: safe_bool
  env_example: 'False'
  env_order: 41
  compose: ${PLEX_METADATA_ALLOW_OVERWRITE-}
  compose_order: 39
  unraid:
    name: Allow Plex Overwrite
    default: False|True
    display: advanced
    required: false
    mask: false
    value: 'False'
    order: 38
- name: PLEX_METADATA_RECHECK_DAYS
  section: Scheduling and processing
  description: Minimum interval before unchanged Plex metadata is compared with TMDb again.
  path:
  - plex_metadata
  - recheck_days
  converter: safe_float
  env_example: '30'
  env_order: 42
  compose: ${PLEX_METADATA_RECHECK_DAYS-}
  compose_order: 40
  unraid:
    name: Plex Metadata Recheck Days
    default: '30'
    display: advanced
    required: false
    mask: false
    value: '30'
    order: 39
- name: PLEX_METADATA_MAX_WRITES_PER_RUN
  section: Scheduling and processing
