services:
  metafusion:
    image: ghcr.io/ray-cys/metafusion:main
    container_name: metafusion
    init: true
    user: "${PUID:-10001}:${PGID:-10001}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      CONFIG_DIR: /config
      KOMETA_PATH: /kometa
      TZ: ${TZ:-UTC}
      PLEX_URL: ${PLEX_URL:-http://10.0.0.1:32400}
      PLEX_TOKEN: ${PLEX_TOKEN:?Set PLEX_TOKEN in .env}
      PLEX_LIBRARIES: ${PLEX_LIBRARIES:-Movies,TV Shows}
      TMDB_API_KEY: ${TMDB_API_KEY:?Set TMDB_API_KEY in .env}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-en}
      TMDB_REGION: ${TMDB_REGION:-US}
      TMDB_LANGUAGE_FALLBACK: ${TMDB_LANGUAGE_FALLBACK:-zh,ja}
      RUN_MODE: ${RUN_MODE:-kometa}
      METAFUSION_RUN: ${METAFUSION_RUN:-False}
      DRY_RUN: ${DRY_RUN:-False}
      RUN_SCHEDULE: ${RUN_SCHEDULE:-True}
      RUN_TIMES: ${RUN_TIMES:-06:00,18:30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RUN_BASIC: ${RUN_BASIC:-True}
      RUN_ENHANCED: ${RUN_ENHANCED:-True}
      RUN_POSTER: ${RUN_POSTER:-True}
      RUN_SEASON: ${RUN_SEASON:-True}
      RUN_BACKGROUND: ${RUN_BACKGROUND:-False}
      RUN_PROCESS: ${RUN_PROCESS:-False}
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-8}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-30}
      CONNECT_TIMEOUT: ${CONNECT_TIMEOUT:-10}
      MAX_IMAGE_MB: ${MAX_IMAGE_MB:-25}
      ALLOW_AMBIGUOUS_EDITIONS: ${ALLOW_AMBIGUOUS_EDITIONS:-False}
      STATUS_FILE: /config/metafusion-status.json
      POSTER_MAX_WIDTH: ${POSTER_MAX_WIDTH:-2000}
      POSTER_MAX_HEIGHT: ${POSTER_MAX_HEIGHT:-3000}
      POSTER_MIN_WIDTH: ${POSTER_MIN_WIDTH:-1000}
      POSTER_MIN_HEIGHT: ${POSTER_MIN_HEIGHT:-1500}
      POSTER_PREFER_VOTE: ${POSTER_PREFER_VOTE:-5.0}
      POSTER_VOTE_RELAXED: ${POSTER_VOTE_RELAXED:-3.5}
      POSTER_VOTE_THRESHOLD: ${POSTER_VOTE_THRESHOLD:-5.0}
      SEASON_MAX_WIDTH: ${SEASON_MAX_WIDTH:-2000}
      SEASON_MAX_HEIGHT: ${SEASON_MAX_HEIGHT:-3000}
      SEASON_MIN_WIDTH: ${SEASON_MIN_WIDTH:-1000}
      SEASON_MIN_HEIGHT: ${SEASON_MIN_HEIGHT:-1500}
      SEASON_PREFER_VOTE: ${SEASON_PREFER_VOTE:-5.0}
      SEASON_VOTE_RELAXED: ${SEASON_VOTE_RELAXED:-0.5}
      SEASON_VOTE_THRESHOLD: ${SEASON_VOTE_THRESHOLD:-3.0}
      BG_MAX_WIDTH: ${BG_MAX_WIDTH:-3840}
      BG_MAX_HEIGHT: ${BG_MAX_HEIGHT:-2160}
      BG_MIN_WIDTH: ${BG_MIN_WIDTH:-1920}
      BG_MIN_HEIGHT: ${BG_MIN_HEIGHT:-1080}
      BG_PREFER_VOTE: ${BG_PREFER_VOTE:-5.0}
      BG_VOTE_RELAXED: ${BG_VOTE_RELAXED:-3.5}
      BG_VOTE_THRESHOLD: ${BG_VOTE_THRESHOLD:-5.0}
    volumes:
      - ${CONFIG_PATH:-./config}:/config
      - ${KOMETA_HOST_PATH:-./kometa}:/kometa
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    stop_grace_period: 60s
    restart: unless-stopped
