services:
  metafusion:
    image: "${METAFUSION_IMAGE:-ghcr.io/ray-cys/metafusion:main}"
    container_name: metafusion
    init: true
    user: "${PUID:-10001}:${PGID:-10001}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      CONFIG_DIR: /config
      PUID: ${PUID:-10001}
      PGID: ${PGID:-10001}
      KOMETA_PATH: ${KOMETA_PATH-}
      TZ: ${TZ:-UTC}
      PLEX_URL: ${PLEX_URL-}
      PLEX_TOKEN: ${PLEX_TOKEN-}
      PLEX_TOKEN_FILE: ${PLEX_TOKEN_FILE-}
      PLEX_LIBRARIES: ${PLEX_LIBRARIES-}
      TMDB_API_KEY: ${TMDB_API_KEY-}
      TMDB_API_KEY_FILE: ${TMDB_API_KEY_FILE-}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE-}
      TMDB_REGION: ${TMDB_REGION-}
      TMDB_LANGUAGE_FALLBACK: ${TMDB_LANGUAGE_FALLBACK-}
      RUN_MODE: ${RUN_MODE-}
      METAFUSION_RUN: ${METAFUSION_RUN-}
      DRY_RUN: ${DRY_RUN-}
      RUN_SCHEDULE: ${RUN_SCHEDULE-}
      RUN_ON_START: ${RUN_ON_START-}
      RUN_TIMES: ${RUN_TIMES-}
      LOG_LEVEL: ${LOG_LEVEL-}
      RUN_BASIC: ${RUN_BASIC-}
      RUN_ENHANCED: ${RUN_ENHANCED-}
      RUN_POSTER: ${RUN_POSTER-}
      RUN_SEASON: ${RUN_SEASON-}
      RUN_BACKGROUND: ${RUN_BACKGROUND-}
      RUN_CLEANUP: ${RUN_CLEANUP-}
      MAX_CONCURRENCY: ${MAX_CONCURRENCY-}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT-}
      CONNECT_TIMEOUT: ${CONNECT_TIMEOUT-}
      PLEX_TIMEOUT: ${PLEX_TIMEOUT-}
      PLEX_RETRIES: ${PLEX_RETRIES-}
      PLEX_RETRY_DELAY: ${PLEX_RETRY_DELAY-}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT-}
      MAX_IMAGE_MB: ${MAX_IMAGE_MB-}
      ALLOW_AMBIGUOUS_EDITIONS: ${ALLOW_AMBIGUOUS_EDITIONS-}
      INCREMENTAL: ${INCREMENTAL-}
      FULL_SCAN_INTERVAL_HOURS: ${FULL_SCAN_INTERVAL_HOURS-}
      IMAGE_UPGRADE_DAYS: ${IMAGE_UPGRADE_DAYS-}
      MOVIE_IMAGE_UPGRADE_DAYS: ${MOVIE_IMAGE_UPGRADE_DAYS-}
      SERIES_IMAGE_UPGRADE_DAYS: ${SERIES_IMAGE_UPGRADE_DAYS-}
      SEASON_IMAGE_UPGRADE_DAYS: ${SEASON_IMAGE_UPGRADE_DAYS-}
      TMDB_CACHE_ENABLED: ${TMDB_CACHE_ENABLED-}
      TMDB_CACHE_TTL_HOURS: ${TMDB_CACHE_TTL_HOURS-}
      TMDB_CACHE_MAX_ENTRIES: ${TMDB_CACHE_MAX_ENTRIES-}
      TMDB_CACHE_MAX_MB: ${TMDB_CACHE_MAX_MB-}
      VALIDATE_OUTPUT: ${VALIDATE_OUTPUT-}
      OUTPUT_BACKUP_COUNT: ${OUTPUT_BACKUP_COUNT-}
      STATUS_FILE: /tmp/metafusion-status.json
      HEALTH_FAIL_ON_JOB_ERROR: ${HEALTH_FAIL_ON_JOB_ERROR:-False}
      HEALTH_MAX_HEARTBEAT_AGE: ${HEALTH_MAX_HEARTBEAT_AGE:-120}
      POSTER_MAX_WIDTH: ${POSTER_MAX_WIDTH-}
      POSTER_MAX_HEIGHT: ${POSTER_MAX_HEIGHT-}
      POSTER_MIN_WIDTH: ${POSTER_MIN_WIDTH-}
      POSTER_MIN_HEIGHT: ${POSTER_MIN_HEIGHT-}
      POSTER_PREFER_VOTE: ${POSTER_PREFER_VOTE-}
      POSTER_VOTE_RELAXED: ${POSTER_VOTE_RELAXED-}
      POSTER_VOTE_THRESHOLD: ${POSTER_VOTE_THRESHOLD-}
      SEASON_MAX_WIDTH: ${SEASON_MAX_WIDTH-}
      SEASON_MAX_HEIGHT: ${SEASON_MAX_HEIGHT-}
      SEASON_MIN_WIDTH: ${SEASON_MIN_WIDTH-}
      SEASON_MIN_HEIGHT: ${SEASON_MIN_HEIGHT-}
      SEASON_PREFER_VOTE: ${SEASON_PREFER_VOTE-}
      SEASON_VOTE_RELAXED: ${SEASON_VOTE_RELAXED-}
      SEASON_VOTE_THRESHOLD: ${SEASON_VOTE_THRESHOLD-}
      BG_MAX_WIDTH: ${BG_MAX_WIDTH-}
      BG_MAX_HEIGHT: ${BG_MAX_HEIGHT-}
      BG_MIN_WIDTH: ${BG_MIN_WIDTH-}
      BG_MIN_HEIGHT: ${BG_MIN_HEIGHT-}
      BG_PREFER_VOTE: ${BG_PREFER_VOTE-}
      BG_VOTE_RELAXED: ${BG_VOTE_RELAXED-}
      BG_VOTE_THRESHOLD: ${BG_VOTE_THRESHOLD-}
    volumes:
      - ${CONFIG_PATH:-./config}:/config
      - ${KOMETA_HOST_PATH:-./kometa}:/kometa
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: ${STOP_GRACE_PERIOD:-20s}
    restart: unless-stopped
